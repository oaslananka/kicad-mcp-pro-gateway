# Deliberately its own Cargo workspace, not a member of the root workspace:
# `cargo build --workspace`/`cargo test --workspace` at the repo root stay
# fast and frontend-independent; the desktop shell is built via `pnpm` /
# `cargo tauri build`, which is a separate CI job (see docs/development/testing.md).
[workspace]

[package]
name = "kicad-mcp-gateway-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "KiCad MCP Pro Gateway desktop shell. Talks only to the daemon's local IPC API."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
interprocess = { version = "2", features = ["tokio"] }
companion-protocol = { path = "../../../crates/protocol" }
companion-core = { path = "../../../crates/core" }

[[bin]]
name = "kicad-mcp-gateway-desktop"
path = "src/main.rs"
