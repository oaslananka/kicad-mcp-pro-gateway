[package]
name = "kicad-mcp-gateway-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The authoritative local runtime for KiCad MCP Pro Gateway: identity, policy, sessions, workspaces, and the local IPC control API."

[[bin]]
name = "kicad-mcp-gateway-daemon"
path = "src/main.rs"

[dependencies]
companion-core = { path = "../../crates/core" }
companion-storage = { path = "../../crates/storage" }
companion-identity = { path = "../../crates/identity" }
companion-workspace = { path = "../../crates/workspace" }
companion-policy = { path = "../../crates/policy" }
companion-sessions = { path = "../../crates/sessions" }
companion-protocol = { path = "../../crates/protocol" }
companion-core-bridge = { path = "../../crates/core-bridge" }
companion-transport = { path = "../../crates/transport" }
companion-audit = { path = "../../crates/audit" }
tokio = { workspace = true, features = ["io-util", "net", "rt", "fs"] }
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
interprocess = { version = "2", features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
# Used only by failure-injection tests that open a second connection to the
# daemon's own SQLite file (locked/corrupt audit store scenarios). Same
# version/features as `companion-storage`, so no second SQLite build.
rusqlite = { version = "0.31", features = ["bundled"] }
companion-identity = { path = "../../crates/identity", features = ["test-util"] }
companion-core-bridge = { path = "../../crates/core-bridge", features = ["test-util"] }
companion-core = { path = "../../crates/core", features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
