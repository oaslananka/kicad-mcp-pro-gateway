[workspace]
resolver = "2"
members = ["crates/core", "crates/storage", "crates/identity", "crates/workspace", "crates/policy", "crates/sessions", "crates/protocol", "crates/core-bridge", "crates/transport", "crates/audit", "crates/checkpoints", "apps/daemon", "apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/oaslananka/kicad-mcp-pro-gateway"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
ulid = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
url = { version = "2", features = ["serde"] }
dirs = "5"
toml = "0.8"
proptest = "1"

[profile.release]
opt-level = 3
lto = true
