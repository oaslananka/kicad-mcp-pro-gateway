version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    ignore:
      # #69: Tauri runtime/build and JS API/CLI minors must migrate together.
      - dependency-name: "tauri"
        versions: [">=2.12.0 <3.0.0"]
      - dependency-name: "tauri-build"
        versions: [">=2.12.0 <3.0.0"]
    groups:
      routine-cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    ignore:
      # #69: the reviewed Rust/vendor/JS Tauri stack must migrate minors together.
      - dependency-name: "@tauri-apps/api"
        versions: [">=2.12.0 <3.0.0"]
      - dependency-name: "@tauri-apps/cli"
        versions: [">=2.12.0 <3.0.0"]
    groups:
      routine-desktop:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      routine-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
