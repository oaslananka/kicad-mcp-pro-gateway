name: OSV Full Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: osv-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: security / osv-full
    permissions:
      actions: read # required by the reusable OSV workflow
      contents: read # required to scan repository lockfiles
      security-events: write # upload OSV SARIF to GitHub code scanning
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      fail-on-vuln: true
      upload-sarif: true
