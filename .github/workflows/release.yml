name: Release Engineering

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build-binaries:
    name: build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_suffix: ".exe"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-17
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build release CLI & Daemon binaries
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$TARGET" -p kicad-mcp-gateway-cli -p kicad-mcp-gateway-daemon

      - name: Package binaries
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.binary_suffix }}
          OS_NAME: ${{ runner.os }}
        run: |
          STAGE_DIR="kicad-mcp-gateway-${REF_NAME}-${TARGET}"
          mkdir -p "$STAGE_DIR"
          cp "target/${TARGET}/release/kicad-mcp-gateway${SUFFIX}" "$STAGE_DIR/"
          cp "target/${TARGET}/release/kicad-mcp-gateway-daemon${SUFFIX}" "$STAGE_DIR/"
          cp README.md LICENSE "$STAGE_DIR/"
          if [ "$OS_NAME" = "Windows" ]; then
            7z a "${STAGE_DIR}.zip" "$STAGE_DIR"
            echo "ARCHIVE_PATH=${STAGE_DIR}.zip" >> "$GITHUB_ENV"
          else
            tar -czvf "${STAGE_DIR}.tar.gz" "$STAGE_DIR"
            echo "ARCHIVE_PATH=${STAGE_DIR}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.target }}
          path: ${{ env.ARCHIVE_PATH }}

  build-desktop:
    name: desktop / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
          - os: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: msi
    env:
      TAURI_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master @ 2026-09-17
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build signed-or-unsigned Tauri package
        working-directory: apps/desktop
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLE: ${{ matrix.bundle }}
        run: pnpm tauri build --target "$TARGET" --bundles "$BUNDLE"

      - name: Verify packaged daemon sidecar
        working-directory: apps/desktop
        run: pnpm verify:sidecar

      - name: Upload desktop package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}

  publish-release:
    name: publish / github-release
    needs: [build-binaries, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets

      - name: Consolidate assets & compute checksums
        run: |
          mkdir -p dist
          find release-assets -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.dmg" -o -name "*.msi" \) -exec cp {} dist/ \;
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release using CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" dist/* \
            --title "KiCad MCP Pro Gateway $TAG_NAME" \
            --generate-notes
