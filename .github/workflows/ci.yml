name: CI

on:
  push:
    branches: [main, compat/tauri-2.12-reviewed-stack]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-09-17
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  msrv:
    name: rust / msrv-1.88
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-09-17
        with:
          toolchain: 1.88.0

      - name: Cache cargo (MSRV)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: msrv-core-1.88-desktop-1.90

      - name: Check workspace at MSRV
        run: cargo check --workspace --all-targets --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Stage daemon resource for Tauri MSRV check
        run: node apps/desktop/scripts/prepare-sidecar.mjs --profile debug

      - name: Install Linux webview dependencies (Tauri MSRV check)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust 1.90 for desktop Tauri MSRV
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-09-17
        with:
          toolchain: 1.90.0

      # Migration-only bootstrap: use the existing lock as the resolver baseline,
      # let Cargo update only what the 2.12 manifest requires, and preserve the
      # resulting lock as CI evidence. This step is removed once Cargo.lock is
      # committed on the migration branch.
      - name: Resolve and check desktop Tauri 2.12 migration
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets

      - name: Upload resolved desktop Cargo lock
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-cargo-lock-migration
          path: apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: error

      - name: Commit resolved desktop Cargo lock
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          LOCK_PATH="apps/desktop/src-tauri/Cargo.lock"
          if git diff --quiet -- "$LOCK_PATH"; then
            echo "Desktop Cargo.lock is already current."
            exit 0
          fi
          LOCK_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${LOCK_PATH}?ref=${BRANCH}" --jq .sha)"
          LOCK_CONTENT="$(base64 -w0 "$LOCK_PATH")"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${LOCK_PATH}" \
            -f message="chore(desktop): refresh Tauri 2.12 lockfile" \
            -f content="$LOCK_CONTENT" \
            -f sha="$LOCK_SHA" \
            -f branch="$BRANCH"

  security:
    name: security / cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-09-17
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: cargo audit
        run: cargo audit

  frontend:
    name: frontend (apps/desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux webview dependencies (Tauri build requirement)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-09-17
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo (src-tauri)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - working-directory: apps/desktop
        run: pnpm audit

      - working-directory: apps/desktop
        run: pnpm typecheck

      - working-directory: apps/desktop
        run: pnpm lint

      - working-directory: apps/desktop
        run: pnpm test

      - working-directory: apps/desktop
        run: pnpm build

      - working-directory: apps/desktop
        run: pnpm sidecar:dev

      - name: cargo fmt --check (src-tauri)
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy (src-tauri)
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  desktop-package:
    name: desktop package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
          - os: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: msi
    env:
      TAURI_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master @ 2026-09-17
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build Tauri package with packaged daemon
        working-directory: apps/desktop
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLE: ${{ matrix.bundle }}
        run: pnpm tauri build --target "$TARGET" --bundles "$BUNDLE"

      - name: Verify packaged daemon sidecar
        working-directory: apps/desktop
        run: pnpm verify:sidecar

      - name: Upload unsigned desktop package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}
