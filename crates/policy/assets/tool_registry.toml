# Maps kicad-mcp-pro MCP tool names to a required capability, risk
# classification, and (only when reviewed) a fail-closed operation-effect
# contract. Any tool name not listed here is denied. A listed tool without an
# `effects` contract is also denied by PolicyEngine until reviewed.
#
# This file is trusted policy source, never caller input. Its source identity
# must match upstream_tool_snapshot.toml exactly; stale or incomplete source
# prevents daemon startup. Upstream discovery never grants access.
#
# Reviewed V1 argument contracts (upstream commit below):
# - sch_get_symbols: src/kicad_mcp/tools/schematic_inspection.py
# - pcb_auto_place_by_schematic: src/kicad_mcp/tools/pcb.py
# - kicad_create_new_project: src/kicad_mcp/tools/project_creation.py
# - pcb_delete_items: src/kicad_mcp/tools/pcb.py
# - lib_create_custom_symbol: src/kicad_mcp/tools/library_local_authoring.py
# - export_gerber: src/kicad_mcp/tools/export_gerber.py

